<nav class="navbar clean-header">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center w-100">
      <!-- Brand -->
      <a class="navbar-brand" href="#">
        <div class="brand-icon">
          <i class="bi bi-cpu"></i>
        </div>
        <span>Facial Emulators</span>
        {{ if .app_version }}
        <span class="app-version">v{{ .app_version }}</span>
        {{ end }}
      </a>

      <!-- Header Right -->
      <div class="header-right">
        <!-- Total de Emuladores -->
        <div class="status-badge" id="totalBadge">
          <span id="totalText"> Total: {{ .counter_cards.total | default 0 }} Emuladores </span>
        </div>

        <!-- Status dos Emuladores Ativos -->
        <div class="status-badge" id="systemStatus">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">{{ .counter_cards.running | default 0 }} Ativos</span>
        </div>

        <!-- Divider -->
        <div class="header-divider"></div>

        <!-- Botão Configurações -->
        <a href="/settings" class="settings-btn" title="Configurações">
          <i class="bi bi-gear"></i>
        </a>

        <!-- Logo da Empresa -->
        <div class="logo-container">
          <img src="/static/images/logo.png" 
               alt="Invenzi Logo" 
               class="company-logo" 
               onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
          
          <!-- Fallback se a imagem não carregar -->
          <div id="logoFallback" class="logo-fallback">INVENZI</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dados para JavaScript (hidden) -->
  <script type="application/json" id="headerData">
    {
      "total": {{ .counter_cards.total | default 0 }},
      "running": {{ .counter_cards.running | default 0 }},
      "stopped": {{ .counter_cards.stopped | default 0 }}
    }
  </script>
</nav>
