# Configuração do servidor HTTP
server:
  address: ":8080"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"

# Configuração do PostgreSQL (banco centralizado)
postgres:
  driver: "postgres"
  host: "localhost"
  port: 5432
  database: "facial_emulator"
  username: "postgres"
  password: "postgres"
  schema: "emulator"
  max_connections: 25
  min_connections: 5
  connection_lifetime: "1h"

# Configuração do banco de dados WXS (sistema externo)
wxsDB:
  driver: "mssql"
  host: "127.0.0.1"
  port: 1433
  database: "W_Access"
  username: "W-Access"
  password: "password"
  timeout: "30s"

# Configurações de logging
logging:
  level: "info"
  format: "json"
  enable_trace: true
  max_file_size: "50MB"
  max_files: 10
