services:
  postgres:
    image: postgres:15-alpine
    container_name: facial-emulator-db
    environment:
      POSTGRES_USER: emulator
      POSTGRES_PASSWORD: emulator123
      POSTGRES_DB: postgres
    # Sem publicar 5432 no host: acs-postgres ja usa a porta.
    # App acessa via rede interna do compose (DB_HOST=postgres).
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - facial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emulator -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facial-emulator-app
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "7070"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: emulator
      DB_PASSWORD: emulator123
      DB_DATABASE: emulator_db
      # Precisa descrever exatamente o que a lista ports abaixo publica.
      # A aplicação usa esta variável para avisar quais dispositivos não
      # vão ser alcançados.
      PUBLISHED_PORT_RANGE: "4000-4399"
    ports:
      # 7070 do host e do AnyDesk neste servidor; a UI sai em 8080.
      # Dentro do container o serviço continua em 7070 (SERVER_PORT).
      - "8080:7070"
      # 400 emuladores. Para mais, troque a linha abaixo e a variável
      # PUBLISHED_PORT_RANGE acima pela mesma faixa.
      - "4000-4399:4000-4399"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - facial-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    driver: local

networks:
  facial-network:
    driver: bridge
