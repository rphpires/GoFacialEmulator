services:
  postgres:
    image: postgres:15-alpine
    container_name: facial-emulator-db
    environment:
      POSTGRES_USER: emulator
      POSTGRES_PASSWORD: emulator123
      POSTGRES_DB: postgres
    # Sem publicar 5432 no host: acs-postgres ja usa a porta.
    # App acessa via rede interna do compose (DB_HOST=postgres).
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - facial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emulator -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facial-emulator-app
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: emulator
      DB_PASSWORD: emulator123
      DB_DATABASE: emulator_db
    ports:
      - "8080:8080"
      - "4000-4999:4000-4999"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - facial-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./traces:/app/traces

volumes:
  postgres_data:
    driver: local

networks:
  facial-network:
    driver: bridge
