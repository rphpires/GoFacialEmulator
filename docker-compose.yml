services:
  postgres:
    image: postgres:15-alpine
    container_name: facial-emulator-db
    environment:
      POSTGRES_USER: emulator
      POSTGRES_PASSWORD: emulator123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - facial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emulator -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facial-emulator-app
    environment:
      # Configuração do servidor
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "7070"

      # # Configuração do PostgreSQL (service_db)
      # PG_HOST: postgres
      # PG_PORT: "5432"
      # PG_USER: emulator
      # PG_PASSWORD: emulator123
      # PG_DATABASE: service_db

      # Configuração do PostgreSQL (emulator_db)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: emulator
      DB_PASSWORD: emulator123
      DB_DATABASE: emulator_db
    ports:
      - "7070:7070"
      # 100 emuladores. Para mais, troque pela linha abaixo:
      # - "4000-4999:4000-4999"
      - "4000-4099:4000-4099"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - facial-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    driver: local

networks:
  facial-network:
    driver: bridge
