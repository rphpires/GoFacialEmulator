<link
  rel="stylesheet"
  href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.min.css"
/>
<div class="container">
  <div class="row text-center">
    <div class="col">
      <div class="counter">
        <i class="fa fa-tablet fa-2x"></i>
        <h2
          class="timer count-title count-number"
          id="counter_total"
          data-to="{{ .counter_cards.total | default 0 }}"
          data-speed="1000"
        >{{ .counter_cards.total | default 0 }}</h2>
        <p class="count-text" style="font-size: 18px"><b>Total</b></p>
      </div>
    </div>
    <div class="col">
      <div class="counter">
        <i class="fa fa-cogs fa-2x"></i>
        <h2
          class="timer count-title count-number"
          id="counter_running"
          data-to="{{ .counter_cards.running | default 0 }}"
          data-speed="1500"
        >{{ .counter_cards.running | default 0 }}</h2>
        <p class="count-text" style="font-size: 18px">Running</p>
      </div>
    </div>
    <div class="col">
      <div class="counter">
        <i class="fa fa-pause fa-2x"></i>
        <h2
          class="timer count-title count-number"
          id="counter_stopped"
          data-to="{{ .counter_cards.stopped | default 0 }}"
          data-speed="1500"
        >{{ .counter_cards.stopped | default 0 }}</h2>
        <p class="count-text" style="font-size: 18px">Stopped</p>
      </div>
    </div>
  </div>
</div>

<script>
  // Função para atualizar contadores com animação
  function updateCounterWithAnimation(elementId, newValue) {
    const element = $('#' + elementId);
    const currentValue = parseInt(element.text()) || 0;
    
    if (currentValue !== newValue) {
      element.attr('data-to', newValue);
      element.data('countToOptions', {
        from: currentValue,
        to: newValue,
        speed: 800,
        refreshInterval: 50,
        formatter: function (value, options) {
          return Math.ceil(value).toString();
        }
      });
      element.countTo(element.data('countToOptions'));
    }
  }

  // Plugin countTo
  (function ($) {
    $.fn.countTo = function (options) {
      options = options || {};

      return $(this).each(function () {
        var settings = $.extend(
          {},
          $.fn.countTo.defaults,
          {
            from: $(this).data("from"),
            to: $(this).data("to"),
            speed: $(this).data("speed"),
            refreshInterval: $(this).data("refresh-interval"),
            decimals: $(this).data("decimals"),
          },
          options
        );

        var loops = Math.ceil(settings.speed / settings.refreshInterval),
          increment = (settings.to - settings.from) / loops;

        var self = this,
          $self = $(this),
          loopCount = 0,
          value = settings.from,
          data = $self.data("countTo") || {};

        $self.data("countTo", data);

        if (data.interval) {
          clearInterval(data.interval);
        }
        data.interval = setInterval(updateTimer, settings.refreshInterval);

        render(value);

        function updateTimer() {
          value += increment;
          loopCount++;

          render(value);

          if (typeof settings.onUpdate == "function") {
            settings.onUpdate.call(self, value);
          }

          if (loopCount >= loops) {
            $self.removeData("countTo");
            clearInterval(data.interval);
            value = settings.to;

            if (typeof settings.onComplete == "function") {
              settings.onComplete.call(self, value);
            }
          }
        }

        function render(value) {
          var formattedValue = settings.formatter.call(self, value, settings);
          $self.html(formattedValue);
        }
      });
    };

    $.fn.countTo.defaults = {
      from: 0,
      to: 0,
      speed: 1000,
      refreshInterval: 100,
      decimals: 0,
      formatter: formatter,
      onUpdate: null,
      onComplete: null,
    };

    function formatter(value, settings) {
      return value.toFixed(settings.decimals);
    }
  })(jQuery);

  jQuery(function ($) {
    // Configurar formatação customizada
    $(".count-number").data("countToOptions", {
      formatter: function (value, options) {
        return Math.ceil(value).toString();
      },
    });

    // Inicializar todos os contadores
    $(".timer").each(function() {
      const $this = $(this);
      const options = $.extend({}, $this.data("countToOptions") || {});
      $this.countTo(options);
    });

    // Função global para atualizar contadores (será chamada pelo SSE)
    window.updateCounters = function(runningCount, stoppedCount, totalCount) {
      updateCounterWithAnimation('counter_running', runningCount);
      updateCounterWithAnimation('counter_stopped', stoppedCount);
      updateCounterWithAnimation('counter_total', totalCount);
    };
  });
</script>

<style>
  .counter {
    background-color: #f5f5f5;
    padding: 20px 0;
    border-radius: 5px;
  }

  .count-title {
    font-size: 40px;
    font-weight: normal;
    margin-top: 10px;
    margin-bottom: 0;
    text-align: center;
  }

  .count-text {
    font-size: 13px;
    font-weight: normal;
    margin-top: 10px;
    margin-bottom: 0;
    text-align: center;
  }

  .fa-2x {
    margin: 0 auto;
    float: none;
    display: table;
    color: #ff5e00;
  }
</style>
