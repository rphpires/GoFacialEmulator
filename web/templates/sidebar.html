<div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-light" style="min-height: 100vh;">
  <div class="d-flex flex-column align-items-start px-3 pt-2">
    
    <!-- Menu sempre visível em desktop, texto esconde em mobile -->
    <ul class="nav flex-column w-100">
      <li class="nav-item">
        <a href="/" class="nav-link text-dark d-flex align-items-center">
          <i class="bi bi-tablet me-2"></i>
          <span class="d-none d-md-inline">Dispositivos</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/comparison" class="nav-link text-dark d-flex align-items-center">
          <i class="bi bi-arrow-left-right me-2"></i>
          <span class="d-none d-md-inline">Comparação</span>
        </a>
      </li>
      <li class="nav-item">
        <button class="nav-link text-success d-flex align-items-center w-100 border-0 bg-transparent" 
                onclick="start_all_emulators()" 
                title="Iniciar Todos">
          <i class="bi bi-play-circle me-2"></i>
          <span class="d-none d-md-inline">Iniciar Todos</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link text-danger d-flex align-items-center w-100 border-0 bg-transparent" 
                onclick="stop_all_emulators()"
                title="Parar Todos">
          <i class="bi bi-stop-circle me-2"></i>
          <span class="d-none d-md-inline">Parar Todos</span>
        </button>
      </li>
      <li class="nav-item">
        <a href="/refresh" class="nav-link text-primary d-flex align-items-center" title="Refresh DB">
          <i class="bi bi-arrow-clockwise me-2"></i>
          <span class="d-none d-md-inline">Refresh DB</span>
        </a>
      </li>
    </ul>
    
    <hr class="w-100 d-none d-md-block">
  </div>
</div>

<script>
  window.start_all_emulators = async () => {
    try {
      const response = await fetch('/start', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ devices: ["all"], enable_log: {} }),
      });
      
      if (response.ok) {
        console.log('Todos os emuladores iniciados');
      } else {
        console.error('Falha ao iniciar emuladores');
      }
    } catch (error) {
      console.error('Erro ao iniciar emuladores:', error);
      alert('Erro ao iniciar emuladores.');
    }
  };

  window.stop_all_emulators = async () => {
    try {
      const response = await fetch('/stop', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ devices: ["all"] }),
      });
      
      if (response.ok) {
        console.log('Todos os emuladores parados');
      } else {
        console.error('Falha ao parar emuladores');
      }
    } catch (error) {
      console.error('Erro ao parar emuladores:', error);
      alert('Erro ao parar emuladores.');
    }
  };
</script>

  /* Melhorar aparência dos botões do sidebar */
